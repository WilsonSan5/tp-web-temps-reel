<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Suivi de commande</title>
  </head>
  <body>
    <h1>Suivi de commande</h1>

    <label for="order-select">Commande :</label>
    <select id="order-select"></select>

    <p id="order-status"></p>

    <script>
      const select = document.getElementById("order-select");
      const statusText = document.getElementById("order-status");
      let orders = [];

      function render() {
        const order = orders.find((o) => o.id === Number(select.value));
        if (!order) {
          statusText.textContent = "Aucune commande sélectionnée";
          return;
        }
        statusText.innerHTML = `Commande #${order.id} (Client #${order.userId}, Produit #${order.productId}, Qté: ${order.quantity}) — État : <strong>${order.status}</strong>`;
      }

      function updateSelect() {
        const current = select.value;
        select.innerHTML = orders
          .map((o) => `<option value="${o.id}">Commande #${o.id}</option>`)
          .join("");
        if (current) select.value = current;
        render();
      }

      fetch("/orders")
        .then((res) => res.json())
        .then((data) => {
          orders = data;
          updateSelect();
        });

      select.addEventListener("change", render);

      const source = new EventSource("/orders/stream");

      source.addEventListener("order-added", (e) => {
        const order = JSON.parse(e.data);
        orders.push(order);
        updateSelect();
      });

      source.addEventListener("order-updated", (e) => {
        const updated = JSON.parse(e.data);
        orders = orders.map((o) => (o.id === updated.id ? updated : o));
        render();
      });

      source.onerror = () => {
        console.log("Coupure, reconnexion automatique…");
      };
    </script>
  </body>
</html>
