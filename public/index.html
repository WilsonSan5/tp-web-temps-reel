<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Suivi de commandes</title>
  </head>
  <body>
    <h1>État des commandes</h1>
    <ul id="order-list"></ul>

    <script>
      const ul = document.getElementById("order-list");

      function renderOrders(orders) {
        if (!orders.length) {
          ul.innerHTML = "<li>Aucune commande pour le moment.</li>";
          return;
        }
        ul.innerHTML = orders
          .map(
            (o) =>
              `<li>
                <strong>Commande #${o.id}</strong> —
                Utilisateur #${o.userId}, Produit #${o.productId}
                (Qté : ${o.quantity}) —
                Statut : <strong>${o.status}</strong>
                <small>(${new Date(o.createdAt).toLocaleString("fr-FR")})</small>
              </li>`,
          )
          .join("");
      }

      // Chargement initial des commandes existantes
      fetch("/orders")
        .then((res) => res.json())
        .then(renderOrders)
        .catch((err) => console.error("Erreur de chargement des commandes :", err));
    </script>
  </body>
</html>
